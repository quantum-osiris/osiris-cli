name: dnalang pytest

# Installs dnalang-core (the `dnalang` distribution) and runs the suite.
# Python 3.9 cannot install dnalang-core; that version stays on the matrix in ci.yml,
# where tests/conftest.py skips the modules that import it.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dnalang-core and pytest dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy requests PyYAML rich networkx cryptography rfc8785 pytest qiskit
          pip install -e ".[research]"
          python -c "import dnalang; print('dnalang', dnalang.__version__, dnalang.__file__)"

      - name: Run pytest
        run: pytest tests/ -q --tb=line --strict-markers -rfE
