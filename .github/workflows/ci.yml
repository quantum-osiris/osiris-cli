name: OSIRIS CI

# Actions on osiris-dnalang are billing-locked; branches pushed to the
# devinphillipdavis/osiris-cli fork run CI there.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04  # 26.04 has no Python 3.9
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy requests PyYAML rich networkx cryptography
          pip install pytest pytest-cov
          python -c 'import subprocess, sys; sys.version_info >= (3, 10) and subprocess.check_call([sys.executable, "-m", "pip", "install", "qiskit"])'
          # The sibling repos that osiris_cli imports (dnalang, organism_sim, aegis-bridge,
          # osiris-governance) are pinned by commit in pyproject's [research] extra. dnalang and
          # osiris-governance need Python 3.10+, so 3.9 runs without them; tests/conftest.py
          # names the tests that leaves out, and they are reported as skipped with that reason.
          python -c 'import subprocess, sys; sys.version_info >= (3, 10) and subprocess.check_call([sys.executable, "-m", "pip", "install", "-e", ".[research]"])'

      - name: Check the research packages are importable (Python 3.10+)
        run: |
          python -c 'import sys; sys.version_info < (3, 10) and sys.exit(0); import dnalang, organism_sim, osiris_governance, qiskit, qiskit_aer; print("dnalang", dnalang.__version__, "| organism_sim OK | osiris_governance OK | qiskit", qiskit.__version__, "| qiskit_aer", qiskit_aer.__version__)'

      - name: Run import smoke tests
        run: |
          python -c "import re, osiris; declared = re.search(r'^version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read(), re.M).group(1); assert osiris.__version__ == declared, (osiris.__version__, declared); print('osiris pkg OK', osiris.__version__)"
          python -c "from osiris.agents import BaseAgent, AURA, AIDEN, CHEOPS, CHRONOS; print('osiris.agents OK')"
          python -c "from osiris.compiler import Lexer, Parser, IROpType; print('osiris.compiler OK')"
          python -c "from osiris.defense import Sentinel, ZeroTrust, PCRB; print('osiris.defense OK')"
          python -c "from osiris.crsm import OsirisPenteract; print('osiris.crsm OK')"
          python -c "from osiris.organisms import Gene, Genome, Organism; print('osiris.organisms OK')"
          python -c "from osiris.sovereign import SovereignAgent; print('osiris.sovereign OK')"
          python -c "from osiris.nclm import NCLM; print('osiris.nclm OK')"
          python -c "from osiris.qbyte import QByteMiner; print('osiris.qbyte OK')"
          python -c "from osiris.core.intent_engine import IntentEngine; print('osiris.core OK')"

      - name: Run tests
        # -rfEs lists every failure, error and skipped test with its reason, so a shrinking suite is visible in the log
        run: pytest tests/ -v --tb=short --strict-markers -rfEs

      - name: Wheel install smoke (what users get from pip)
        run: |
          python -m pip install build
          python -m build --wheel --outdir /tmp/wheel .
          python -m venv /tmp/wv
          /tmp/wv/bin/pip install /tmp/wheel/*.whl
          cd /tmp
          /tmp/wv/bin/osiris --help > /dev/null
          /tmp/wv/bin/python -c "import osiris_cli, osiris_termux_console, protege, osiris_bench; print('console', osiris_cli.__version__); print('bench tasks', len(osiris_bench.load_tasks()))"

  quantinuum:
    # Runs the real pytket compile path and the qnexus-SDK adapter, which the matrix above skips or
    # sends to the static fallback because it installs neither. Any skip here fails the job.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install osiris-cli with the quantinuum and nexus extras
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy requests PyYAML rich networkx cryptography pytest
          pip install -e ".[quantinuum,nexus]"
          python -c "import pytket, qnexus; print('pytket', pytket.__version__, '| qnexus', qnexus.__version__ if hasattr(qnexus, '__version__') else 'installed')"

      - name: Quantinuum and Nexus tests (no skips allowed)
        run: |
          set -o pipefail
          pytest tests/test_nexus_sdk.py tests/test_quantinuum_client.py tests/test_tket_and_quantinuum_nexus.py \
            -v --tb=short --strict-markers -rfEs | tee /tmp/quantinuum.log
          if grep -E "^SKIPPED|[0-9]+ skipped" /tmp/quantinuum.log; then echo "::error::a Quantinuum/Nexus test was skipped"; exit 1; fi

  lint:
    runs-on: ubuntu-24.04  # 26.04 has no Python 3.9
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check --select E,F,W --ignore E501 osiris_launcher.py osiris_cli.py osiris_nclm_cli.py osiris_livlm.py nclm/ qbyte_system/ osiris/
